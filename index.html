<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://srclient.netlify.app/">
    <title>Перенаправление...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
        }

        .container {
            max-width: 500px;
            padding: 40px 30px;
            background: #141414;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #2a2a2a;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: #a0a0a0;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        a {
            display: inline-block;
            padding: 12px 28px;
            background: #ffffff;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.15s;
        }

        a:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        a:active {
            transform: translateY(0);
        }

        .hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
    <script>
        // JavaScript redirect
        window.location.replace("https://srclient.netlify.app/");
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Перенаправление...</h1>
        <p>Вы будете автоматически перенаправлены на нужную страницу.</p>
        <a href="https://srclient.netlify.app/">Перейти вручную</a>
        <p class="hint">Если перенаправление не сработало, нажмите на кнопку выше</p>
    </div>
</body>
</html>
